<script type="text/javascript">
    var decrypt_input_id=null;
    function showPassword(input_id,field_label) {
        decrypt_input_id = input_id;
        $('#field_label').html(field_label);
        $('textarea[name=decrypted]').val('********');
        $('#PassWordField').modal('show');
    }
    function submit_decrypt() {
        var passwd = document.getElementById('decrypt_password').value;
        $.request('onGetPasswordField', {
            data: {
                input_id: decrypt_input_id,
                field_label: $('#field_label').html(),
                password: passwd
            },
            complete: function(data,request) {
                if (typeof data.responseJSON.result !== 'undefined') {
                    $('textarea[name=decrypted]').val(data.responseJSON.result);
                }
            }
        });
    }
</script>
